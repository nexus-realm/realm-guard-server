# git-cliff — changelog + calcul de version (Conventional Commits). https://git-cliff.org
[changelog]
header = """
# Changelog

Toutes les modifications notables de ce projet sont documentées ici.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Non publié]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}** : {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Fonctionnalités" },
  { message = "^fix", group = "Corrections" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactorisation" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "Intégration continue" },
  { message = "^build", group = "Build" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore", group = "Divers" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
# Première coupe : sans tag antérieur, git-cliff n'applique aucune règle de bump
# et retombe sur `initial_tag` (défaut 0.1.0). Le serveur est publié en v1 avec le
# reste de la pile (cœur + mobile) → on démarre la ligne publiée à 1.0.0. Sans
# effet dès qu'un tag existe (les coupes suivantes partent du dernier tag).
initial_tag = "1.0.0"
