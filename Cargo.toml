[package]
name = "realm-guard-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Sync server (Axum) for Realm Guard — E2EE multi-device."
repository = "https://github.com/nexus-realm/realm-guard-server"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
realm-guard-core = { path = "../realm-guard-core" }
redis = { version = "1", features = ["tokio-comp"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sentry = { version = "0.46", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "macros",
    "migrate",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
