# Stack locale (dev / smoke test). Caddy est la porte d'entrée HTTP.
services:
  app:
    build:
      context: ..
      dockerfile: realm-guard-server/Dockerfile
    environment:
      RG_SERVER_ADDR: "0.0.0.0:8080"
      DATABASE_URL: "postgres://realmguard:realmguard@postgres:5432/realmguard"
      REDIS_URL: "redis://redis:6379"
      RUST_LOG: "info"
      # ⚠️ DEV ONLY — secret serveur OPAQUE de développement (partagé, sans valeur).
      # En prod : NE PAS réutiliser. Générer UNE fois avec
      #   docker compose run --rm app generate-setup
      # puis fournir la valeur via un secret monté (RG_OPAQUE_SETUP_FILE). La
      # régénérer invaliderait tous les comptes.
      RG_OPAQUE_SETUP: "hXSpX6hlNwFfb9CT6ejrqcvBldLjijuKNP8f4dgLh2DOHNJwkCiBK26OlZQ8Nftn/sgnezf6k+1RLBv99PA/9x4ztaK4bh5H/3E8Y8ZvNj/cNeOeaLsszKJROR2UxZkPUAR+0T0p1O2jjklF3a6Kd7+tF4O4tbeHacChdARUmUE="
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: realmguard
      POSTGRES_PASSWORD: realmguard
      POSTGRES_DB: realmguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realmguard -d realmguard"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.2 # LTS épinglée (P5) — plus de :latest
    depends_on:
      - app
      - postgres-exporter
      - redis-exporter
      - node-exporter
      - cadvisor
      - alertmanager
    # `command` explicite (P5) : rétention TSDB bornée + recharge à chaud. Override
    # le défaut de l'image, d'où le rappel de `--config.file`/`--storage.tsdb.path`.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle" # POST /-/reload sans redémarrer le conteneur
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro # règles d'alerte (P3)
      - prom_data:/prometheus # TSDB persistante (sinon rétention sans effet)
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Routage des alertes (P3 — cf. docs/OBSERVABILITY.md). Reçoit les alertes
  # *firing* de Prometheus, les regroupe/déduplique, et les route vers Discord
  # (+ Watchdog vers un heartbeat externe). v0.28+ requise pour le webhook_url_file
  # Discord (secret hors-git). Les secrets sont montés depuis ./secrets ; absents,
  # Alertmanager démarre quand même (échec de notif journalisé, non fatal).
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  # ── Exporters de métriques infra (P2 — cf. docs/OBSERVABILITY.md) ──────────
  # Chacun expose /metrics sur le réseau interne ; Prometheus les scrape (cf.
  # prometheus.yml). Aucun port publié sur l'hôte (hygiène).

  # Postgres : connexions, taille de base, up/down, statistiques de requêtes.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      # ⚠️ DEV : réutilise le compte applicatif. En prod, un rôle de supervision
      # dédié (droits `pg_monitor`) fourni via secret monté, jamais ce compte.
      DATA_SOURCE_NAME: "postgresql://realmguard:realmguard@postgres:5432/realmguard?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Redis : mémoire utilisée, clients connectés, up/down, hits/miss.
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Hôte : CPU / RAM / disque. Sur Docker Desktop, mesure la VM Linux
  # sous-jacente (pas Windows) ; en prod sur hôte Linux, c'est bien la machine.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  # Par conteneur : CPU / RAM / réseau / FS de chaque service. Accès privilégié
  # au runtime requis ; sur Docker Desktop Windows, le support est partiel.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  # Visualisation (P5 — cf. docs/OBSERVABILITY.md). Datasource + dashboards
  # provisionnés **as-code** depuis grafana/provisioning et grafana/dashboards :
  # aucun clic, tout est versionné et reproductible.
  grafana:
    image: grafana/grafana:11.2.2
    depends_on:
      - prometheus
    environment:
      # ⚠️ DEV : accès anonyme en lecture (voir les dashboards sans login). En prod,
      # désactiver l'anonyme et poser un mot de passe admin fort via secret monté.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "admin" # DEV ONLY
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      # Monter les sous-dossiers ciblés (pas le parent) : sinon on masque les
      # dossiers de provisioning par défaut de l'image (plugins/, alerting/…) et
      # Grafana journalise des erreurs « répertoire absent » bénignes.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  prom_data:
  grafana_data:
