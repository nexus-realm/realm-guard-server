global:
  scrape_interval: 15s
  # Sans ce réglage, l'évaluation des règles tomberait au défaut (1 min), rendant
  # le `for:` des alertes grossier (une alerte `for: 1m` mettrait jusqu'à ~2 min).
  evaluation_interval: 15s

# Règles d'alerte (P3 — cf. rules/ et docs/OBSERVABILITY.md), évaluées en continu.
rule_files:
  - /etc/prometheus/rules/*.yml

# Où router les alertes qui passent *firing*.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Méta-supervision : Prometheus se scrape lui-même (P5).
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "realm-guard-server"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]

  # Exporters infra (P2 — cf. docs/OBSERVABILITY.md). Ports par défaut de chaque
  # exporter ; résolus par nom de service sur le réseau Compose.
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
