# cargo-deny — chaîne d'approvisionnement (vulnérabilités, licences, sources).
[advisories]
version = 2
# atomic-polyfill (archivé, non maintenu) est tiré transitivement par
# realm-guard-core → postcard → heapless 0.7. Inerte sur nos cibles (atomiques
# natives), aucune mise à niveau disponible → advisory informatif ignoré.
ignore = ["RUSTSEC-2023-0089"]

[licenses]
version = 2
# Licences permissives autorisées (à étendre au besoin).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
